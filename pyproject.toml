[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftmap"
version = "0.4.0"
description = "Enhancing Leaflet maps with high-performance WebGL overlays and hierarchical controls for Shiny"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anywidget>=0.4.0",
    # Imported directly (map.py declares traits with it); today it arrives
    # transitively through anywidget -> ipywidgets, but a direct import deserves
    # a direct requirement.
    "traitlets",
    "numpy",
    # The tile-provider catalogue behind name-callable basemaps
    # ("CartoDB.DarkMatter", "Esri.WorldImagery", ...). Pure metadata, no
    # compiled bits, so it rides along everywhere the widget does.
    "xyzservices",
]

[project.urls]
Repository = "https://github.com/Rkleisley/swiftmap"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]
# add_imagery's raster engine (warp to the map CRS, band reads, nodata masks).
# Optional so the core carries no GDAL; only imagery ingest needs it.
imagery = [
    "rasterio",
]
# The bidirectional Streamlit component (swiftmap.streamlit.st_swiftmap). The
# component's frontend ships in every wheel; only rendering it needs Streamlit.
streamlit = [
    "streamlit>=1.30",
]

# The parser suite covers every supported data source, so running it in full needs
# them all installed. They stay optional at runtime: each test module skips itself
# when its library is absent.
test = [
    "pytest",
    "pandas",
    "polars",
    "geopandas",
    "shapely",
    "geostructures",
]

[tool.setuptools.packages.find]
include = ["swiftmap*"]

# The built JS bundles. Produced by `npm run build` from src/ and committed, so
# installing the Python package never requires Node: the anywidget bundle in
# static/, and the Streamlit component -- React, Leaflet, glify, Geoman and CSS
# bundled whole, so it works with no network -- in streamlit/frontend/.
[tool.setuptools.package-data]
swiftmap = ["static/*", "streamlit/frontend/*"]
