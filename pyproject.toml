[build-system]
# >=77 for PEP 639 SPDX license expressions.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftmap"
version = "0.5.1"
description = "WebGL-accelerated Leaflet maps with one core and four stacks -- Jupyter/Shiny widget, React, Streamlit, and self-contained static exports; offline-first for closed networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robert Kleisley", email = "rckleisley@gmail.com" }]
keywords = ["leaflet", "map", "webgl", "gis", "jupyter", "shiny", "streamlit",
            "react", "anywidget", "geospatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.9"
dependencies = [
    "anywidget>=0.4.0",
    # Imported directly (map.py declares traits with it); today it arrives
    # transitively through anywidget -> ipywidgets, but a direct import deserves
    # a direct requirement.
    "traitlets",
    "numpy",
    # The tile-provider catalogue behind name-callable basemaps
    # ("CartoDB.DarkMatter", "Esri.WorldImagery", ...). Pure metadata, no
    # compiled bits, so it rides along everywhere the widget does.
    "xyzservices",
]

[project.urls]
Repository = "https://github.com/Rkleisley/swiftmap"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]
# add_imagery's raster engine (warp to the map CRS, band reads, nodata masks).
# Optional so the core carries no GDAL; only imagery ingest needs it.
imagery = [
    "rasterio",
]
# The bidirectional Streamlit component (swiftmap.streamlit.st_swiftmap). The
# component's frontend ships in every wheel; only rendering it needs Streamlit.
streamlit = [
    "streamlit>=1.30",
]
# H3 cell ids as a geometry input: a bare cell string, a list of them, or a
# table column becomes hexagon polygons. Optional so the core stays pure-Python;
# only H3 ingest needs the bindings.
h3 = [
    "h3>=4",
]

# The parser suite covers every supported data source, so running it in full needs
# them all installed. They stay optional at runtime: each test module skips itself
# when its library is absent.
test = [
    "pytest",
    "pandas",
    "polars",
    "geopandas",
    "shapely",
    "geostructures",
    "h3>=4",
    # The MVT parity suite pins swiftmap's dependency-free decoder to the
    # reference implementation.
    "mapbox-vector-tile",
]

[tool.setuptools.packages.find]
include = ["swiftmap*"]

# The built JS bundles. Produced by `npm run build` from src/ and committed, so
# installing the Python package never requires Node: the anywidget bundle in
# static/, and the Streamlit component -- React, Leaflet, glify, Geoman and CSS
# bundled whole, so it works with no network -- in streamlit/frontend/.
[tool.setuptools.package-data]
swiftmap = ["static/*", "streamlit/frontend/*"]
