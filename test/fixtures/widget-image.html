<!doctype html>
<meta charset="utf-8">
<style>html,body,#host{margin:0;height:100%;width:100%}</style>
<!-- anywidget injects _css in production; the fixture must too. -->
<link rel="stylesheet" href="/swiftmap/static/widget.css">
<div id="host"></div>
<script type="module">
// Imagery overlays, one layer per source path. The URL layer is exactly what a
// plain-JS consumer writes -- config only, no Python anywhere; the buffer layer
// is the widget path, bytes under the layer id on the binary transport.
import widget, { createHostStub } from "/dist/anywidget.js";

// The host: the bundle's own reference stub (src/host.js) -- the same five
// methods the export and every embedding drive the core with.
const makeModel = (state) => createHostStub(state, { comm: { comm_id: "test" } });

// A 1x1 red PNG; stretched over its bounds box it paints a solid rectangle.
const PNG_B64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";
const pngBytes = Uint8Array.from(atob(PNG_B64), c => c.charCodeAt(0));

const model = makeModel({
  layers: [
    { id: "imgurl", type: "image", name: "URL Image", layer_group: "Imagery",
      visible: true, opacity: 0.8,
      bounds: [[35.90, -5.35], [36.00, -5.25]],
      url: "data:image/png;base64," + PNG_B64 },
    { id: "imgbuf", type: "image", name: "Buffer Image", layer_group: "Imagery",
      visible: true, opacity: 1,
      bounds: [[36.06, -5.35], [36.16, -5.25]] },
  ],
  group_configs: {},
  coordinate_buffers: { "imgbuf": new DataView(pngBytes.buffer) },
  center: [36.03, -5.30], zoom: 11, crs: "EPSG:3857",
  auto_sync: true, sync_trigger: 0, show_logo: false,
});

window.__model = model;
await widget.render({ model, el: document.getElementById("host") });
window.__ready = true;
</script>
