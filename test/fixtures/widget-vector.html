<!doctype html>
<meta charset="utf-8">
<style>html,body,#host{margin:0;height:100%;width:100%}</style>
<!-- anywidget injects _css in production; the fixture must too. -->
<link rel="stylesheet" href="/swiftmap/static/widget.css">
<div id="host"></div>
<script type="module">
// One polyline and one polygon, NO point layers: each geometry must earn its own pixels.
// The main fixture's visible-pixels test hides a whole group, so a blank line could hide
// behind the points' contribution forever -- which is exactly how "no swiftmap polyline
// has ever rendered" shipped unnoticed until a plain-JS consumer had no points on screen.
import widget from "/dist/anywidget.js";

function makeModel(state) {
  const listeners = {};
  const model = {
    comm: { comm_id: "test" },
    get: k => state[k],
    set(k, v) { state[k] = v; (listeners["change:" + k] || []).forEach(f => f()); },
    on(e, f) { (listeners[e] = listeners[e] || []).push(f); },
    send() {}, save_changes() {},
  };
  return model;
}

const model = makeModel({
  layers: [
    // Python-built vectors ship coordinates as a binary buffer under the layer id and
    // put nothing in the config -- the route and zone here ride that path. The timed
    // pair below keeps inline `locations`, the hand-built-config fallback.
    { id: "ln", type: "polyline", name: "Route", layer_group: "Vectors", visible: true,
      color: "#ff6600", weight: 8, opacity: 1, properties: { kind: "route" },
      bounds: [[36.00, -5.35], [36.10, -5.15]] },
    { id: "pg", type: "polygon", name: "Zone", layer_group: "Vectors", visible: true,
      color: "#00ff00", fillOpacity: 0.8, properties: { kind: "zone" },
      bounds: [[35.98, -5.32], [36.04, -5.22]] },
    // A timed pair alongside the timeless pair: the bucket engages the GPU time path
    // (some layer has time), timeless features stay always-visible, and these two swap
    // in and out per tick without the bucket ever rebuilding.
    { id: "ln2", type: "polyline", name: "Timed Route", layer_group: "Vectors",
      visible: true, color: "#0000ff", weight: 8, opacity: 1,
      properties: { kind: "timed" },
      time: { field: "kind", duration: "period" },
      locations: [[36.06, -5.35], [36.09, -5.30]] },
    { id: "pg2", type: "polygon", name: "Timed Zone", layer_group: "Vectors",
      visible: true, color: "#ff00ff", fillOpacity: 0.8, properties: { kind: "timed" },
      time: { field: "kind", duration: "period" },
      locations: [[36.05, -5.24], [36.05, -5.18], [36.09, -5.18], [36.05, -5.24]] },
  ],
  group_configs: {},
  coordinate_buffers: {
    "ln": new DataView(new Float64Array(
        [36.00, -5.35, 36.10, -5.15]).buffer),
    "pg": new DataView(new Float64Array(
        [35.98, -5.32, 35.98, -5.22, 36.04, -5.22, 35.98, -5.32]).buffer),
    "ln2::times": new DataView(new Float64Array(
        [Date.UTC(2026, 0, 2, 12), Date.UTC(2026, 0, 2, 12)]).buffer),
    "pg2::times": new DataView(new Float64Array(
        [Date.UTC(2026, 0, 1), Date.UTC(2026, 0, 1)]).buffer),
  },
  center: [36.03, -5.25], zoom: 11, crs: "EPSG:3857",
  auto_sync: true, sync_trigger: 0, show_logo: false,
});

window.__model = model;
await widget.render({ model, el: document.getElementById("host") });
window.__ready = true;
</script>
