<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;width:100%}
#host{width:100%;height:100%;display:none}</style>
<!-- The widget renders inside a HIDDEN host, the way a Shiny nav_panel holds a map on
     an unselected tab: Leaflet initialises at 0x0 and caches it, so a fit request
     applied at map-ready computes its zoom from a zero-size lie. Revealing the host
     must re-measure and re-apply the fit -- the bug was that nothing ever did. -->
<link rel="stylesheet" href="/swiftmap/static/widget.css">
<div id="host"></div>
<script type="module">
import widget from "/dist/anywidget.js";

function makeModel(state) {
  const listeners = {};
  const model = {
    comm: { comm_id: "test" },
    sent: [],
    get: k => state[k],
    set(k, v) { state[k] = v; (listeners["change:" + k] || []).forEach(f => f()); },
    on(e, f) { (listeners[e] = listeners[e] || []).push(f); },
    send(content, buffers) { model.sent.push({ content, buffers }); },
    save_changes() {},
  };
  return model;
}

const model = makeModel({
  layers: [],
  group_configs: {}, coordinate_buffers: {},
  // What auto-fit leaves for the frontend: the union of four polygons around the
  // strait, nowhere near the fallback view's framing at zoom 10.
  fit_bounds_request: { bounds: [[35.85, -5.7], [36.17, -5.16]],
                        max_zoom: 15, padding: 30, seq: 1 },
  center: [20.0, 10.0], zoom: 3, crs: "EPSG:3857",
  auto_sync: true, sync_trigger: 0, show_logo: false,
});

window.__model = model;
await widget.render({ model, el: document.getElementById("host") });
window.__reveal = () => { document.getElementById("host").style.display = "block"; };
window.__ready = true;
</script>
